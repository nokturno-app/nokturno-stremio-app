name: docker
# Docker obrazy pro amd64, arm64 a arm (i Mikrotik) jako tar soubory přiložené k vydání.
# Staví se z vydání v tomhle repu (zip s doplňkem), takže nepotřebuje zdrojáky soukromého repa.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: { description: "Tag vydání (např. v9.4.0)", required: true }

permissions:
  contents: write

jobs:
  obraz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plat: amd64, docker: linux/amd64 }
          - { plat: arm64, docker: linux/arm64 }
          - { plat: arm,   docker: linux/arm/v7 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vydání
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'nokturno-*.zip'
          unzip -q nokturno-*.zip
          test -d nokturno
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "V=${TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sestavit tar
        run: |
          docker buildx build --platform ${{ matrix.docker }} -t nokturno:$V \
            --output type=docker,dest=nokturno-$V-docker-${{ matrix.plat }}.tar .
      - name: Přiložit k vydání
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$TAG" "nokturno-$V-docker-${{ matrix.plat }}.tar" -R "$GITHUB_REPOSITORY" --clobber
